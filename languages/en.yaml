PLUGIN_CW_SPAMSCHUTZ:
  ABGEWIESEN: "Unfortunately your message could not be sent. Please try again in a few minutes or contact us directly by e-mail."
  SEITE_NEU_LADEN: "The form was open for too long. Please reload the page and submit it again."
  ENABLED_LABEL: "Plugin enabled"
  KOEDERFELD_LABEL: "Honeypot field"
  KOEDERFELD_HELP: "An invisible field that only bots fill in. If it is filled in, the submission is rejected."
  MINDESTZEIT_SECTION_TITLE: "Minimum fill time"
  MINDESTZEIT_AKTIV_LABEL: "Check the fill time"
  MINDESTZEIT_AKTIV_HELP: "A person needs a few seconds to fill in a form; bots submit immediately. A submission for a form that was never loaded is rejected as well."
  MINDESTZEIT_SEKUNDEN_LABEL: "At least (seconds)"
  MINDESTZEIT_MAX_STUNDEN_LABEL: "At most (hours)"
  MINDESTZEIT_MAX_STUNDEN_HELP: "A form that was open for longer has to be reloaded."
  INHALT_SECTION_TITLE: "Content rules"
  INHALT_AKTIV_LABEL: "Check the content"
  INHALT_MAX_LINKS_LABEL: "Links allowed per submission"
  INHALT_FREMDE_SCHRIFT_LABEL: "Reject messages in foreign scripts"
  INHALT_FREMDE_SCHRIFT_HELP: "Off by default. Rejects messages written mostly in a script this site does not itself use – or a few such characters together with a link. Which scripts count as foreign follows from the languages of the installation; a single name in a foreign script is always allowed."
  INHALT_SPERRWOERTER_LABEL: "Blocked words"
  INHALT_SPERRWOERTER_HELP: "If one of these words appears anywhere in the submission, it is rejected. Case does not matter."
  INHALT_SPAM_ENDUNGEN_LABEL: "Spam domain endings"
  INHALT_SPAM_ENDUNGEN_HELP: "Links to domains with these endings almost only lead to spam (for example top, xyz). A submission containing such a link is rejected."
  BEGRENZUNG_SECTION_TITLE: "Rate limit per sender"
  BEGRENZUNG_AKTIV_LABEL: "Apply a rate limit"
  BEGRENZUNG_ANZAHL_LABEL: "Submissions allowed"
  BEGRENZUNG_MINUTEN_LABEL: "… within this many minutes"
  MELDUNG_SECTION_TITLE: "Message"
  MELDUNG_LABEL: "Message shown on rejection"
  MELDUNG_HELP: "Leave it empty for the built-in text (\"Your message could not be sent …\"). Always offer a way out for real people, such as an email address."
  HINWEIS_CONTENT: "Protects **every form** on the site automatically – contact, enquiries, registrations, membership. No captcha, no cookies, no third-party service; real visitors never notice it. Rejected submissions are counted per day and reason (no content, no IP addresses)."
  KOEDER_LABEL: "Please leave this field empty"
  FREMDE_FORMULARE_LABEL: "Protect further forms"
  FREMDE_FORMULARE_HELP: "Forms that do not come from the form plugin: enter the exact value of their action attribute, for example /newsletter/subscribe. The entry is matched against the end of the address, so it has to start with a slash — a bare \"subscribe\" would also match \"/unsubscribe\". A missing slash is added for you. Empty means none."

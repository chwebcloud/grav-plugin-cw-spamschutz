PLUGIN_CW_SPAMSCHUTZ:
  ABGEWIESEN: "Purtroppo il suo messaggio non ha potuto essere inviato. La preghiamo di riprovare tra qualche minuto o di scriverci direttamente per e-mail."
  SEITE_NEU_LADEN: "Il modulo è rimasto aperto troppo a lungo. Ricarichi la pagina e lo invii di nuovo."
  ENABLED_LABEL: "Plugin attivato"
  KOEDERFELD_LABEL: "Campo esca"
  KOEDERFELD_HELP: "Un campo invisibile che solo i bot compilano. Se viene compilato, l'invio viene rifiutato."
  MINDESTZEIT_SECTION_TITLE: "Tempo minimo"
  MINDESTZEIT_AKTIV_LABEL: "Verificare il tempo di compilazione"
  MINDESTZEIT_AKTIV_HELP: "Una persona impiega alcuni secondi per compilare un modulo; i bot inviano subito. Viene rifiutato anche un invio per un modulo mai caricato."
  MINDESTZEIT_SEKUNDEN_LABEL: "Almeno (secondi)"
  MINDESTZEIT_MAX_STUNDEN_LABEL: "Al massimo (ore)"
  MINDESTZEIT_MAX_STUNDEN_HELP: "Un modulo rimasto aperto più a lungo deve essere ricaricato."
  INHALT_SECTION_TITLE: "Regole sul contenuto"
  INHALT_AKTIV_LABEL: "Verificare il contenuto"
  INHALT_MAX_LINKS_LABEL: "Link consentiti per invio"
  INHALT_FREMDE_SCHRIFT_LABEL: "Rifiutare i messaggi in scritture straniere"
  INHALT_FREMDE_SCHRIFT_HELP: "Disattivato di default. Respinge i messaggi scritti prevalentemente in una scrittura che questo sito non usa – o pochi caratteri di quel tipo insieme a un link. Quali scritture valgono come estranee dipende dalle lingue dell’installazione; un singolo nome in una scrittura estranea è sempre ammesso."
  INHALT_SPERRWOERTER_LABEL: "Parole bloccate"
  INHALT_SPERRWOERTER_HELP: "Se una di queste parole compare nell'invio, questo viene rifiutato. Maiuscole e minuscole non contano."
  INHALT_SPAM_ENDUNGEN_LABEL: "Estensioni di dominio da spam"
  INHALT_SPAM_ENDUNGEN_HELP: "I link a domini con queste estensioni portano quasi solo a spam (per esempio top, xyz). Un invio che contiene un link simile viene rifiutato."
  BEGRENZUNG_SECTION_TITLE: "Limite per mittente"
  BEGRENZUNG_AKTIV_LABEL: "Applicare un limite"
  BEGRENZUNG_ANZAHL_LABEL: "Invii consentiti"
  BEGRENZUNG_MINUTEN_LABEL: "… nell'arco di (minuti)"
  MELDUNG_SECTION_TITLE: "Messaggio"
  MELDUNG_LABEL: "Messaggio mostrato in caso di rifiuto"
  MELDUNG_HELP: "Lasciare vuoto per il testo predefinito («Il suo messaggio non è stato inviato …»). Indicare sempre una via d'uscita per le persone reali, per esempio un indirizzo e-mail."
  HINWEIS_CONTENT: "Protegge **tutti i moduli** del sito automaticamente – contatto, richieste, iscrizioni, adesione. Nessun captcha, nessun cookie, nessun servizio di terzi; i visitatori reali non si accorgono di nulla. Gli invii respinti vengono contati per giorno e motivo (senza contenuti, senza indirizzi IP)."
  KOEDER_LABEL: "Si prega di lasciare vuoto questo campo"
  FREMDE_FORMULARE_LABEL: "Proteggere altri moduli"
  FREMDE_FORMULARE_HELP: "Moduli che non provengono dal plugin form: inserire esattamente il valore del loro attributo action, per esempio /newsletter/subscribe. Vuoto significa nessuno. Solo i moduli elencati qui ricevono l’esca e la marca temporale."

PLUGIN_CW_SPAMSCHUTZ:
  ABGEWIESEN: "Ihre Nachricht konnte leider nicht gesendet werden. Bitte versuchen Sie es in einigen Minuten erneut oder schreiben Sie uns direkt per E-Mail."
  SEITE_NEU_LADEN: "Das Formular war zu lange geöffnet. Bitte laden Sie die Seite neu und senden Sie es noch einmal."
  ENABLED_LABEL: "Plugin aktiviert"
  KOEDERFELD_LABEL: "Köderfeld"
  KOEDERFELD_HELP: "Unsichtbares Feld, das nur Bots ausfüllen. Füllt es jemand aus, wird die Einsendung abgewiesen."
  MINDESTZEIT_SECTION_TITLE: "Mindestzeit"
  MINDESTZEIT_AKTIV_LABEL: "Mindestzeit prüfen"
  MINDESTZEIT_AKTIV_HELP: "Ein Mensch braucht einige Sekunden, um ein Formular auszufüllen; Bots senden sofort ab. Wer ein Formular abschickt, das er gar nicht geladen hat, wird ebenfalls abgewiesen."
  MINDESTZEIT_SEKUNDEN_LABEL: "Mindestens (Sekunden)"
  MINDESTZEIT_MAX_STUNDEN_LABEL: "Höchstens (Stunden)"
  MINDESTZEIT_MAX_STUNDEN_HELP: "Ein Formular, das länger offen war, muss neu geladen werden."
  INHALT_SECTION_TITLE: "Inhaltsregeln"
  INHALT_AKTIV_LABEL: "Inhalt prüfen"
  INHALT_MAX_LINKS_LABEL: "Höchstens Links je Einsendung"
  INHALT_FREMDE_SCHRIFT_LABEL: "Nachrichten in fremder Schrift abweisen"
  INHALT_FREMDE_SCHRIFT_HELP: "AUS als Vorgabe. Weist Nachrichten ab, die überwiegend in einer Schrift stehen, die diese Website selbst nicht führt – oder wenige solche Zeichen zusammen mit einem Link. Welche Schriften als fremd gelten, ergibt sich aus den Sprachen der Installation; ein einzelner Name in fremder Schrift ist immer erlaubt."
  INHALT_SPERRWOERTER_LABEL: "Sperrwörter"
  INHALT_SPERRWOERTER_HELP: "Kommt eines dieser Wörter irgendwo in der Einsendung vor, wird sie abgewiesen. Gross/Klein egal."
  INHALT_SPAM_ENDUNGEN_LABEL: "Spam-Domainendungen"
  INHALT_SPAM_ENDUNGEN_HELP: "Links auf Domains mit diesen Endungen führen fast nur zu Spam (z. B. top, xyz). Eine Einsendung mit einem solchen Link wird abgewiesen."
  BEGRENZUNG_SECTION_TITLE: "Begrenzung je Absender"
  BEGRENZUNG_AKTIV_LABEL: "Begrenzen"
  BEGRENZUNG_ANZAHL_LABEL: "Höchstens Einsendungen"
  BEGRENZUNG_MINUTEN_LABEL: "… innerhalb von Minuten"
  MELDUNG_SECTION_TITLE: "Meldung"
  MELDUNG_LABEL: "Meldung bei Abweisung"
  MELDUNG_HELP: "Leer lassen heisst: Standardtext («Ihre Nachricht konnte nicht gesendet werden …»). Bitte immer einen Ausweg für echte Menschen nennen, etwa die E-Mail-Adresse."
  HINWEIS_CONTENT: "Schützt **alle Formulare** der Website automatisch – Kontakt, Anfragen, Anmeldungen, Beitritt. Kein Captcha, keine Cookies, kein Drittdienst; echte Besucherinnen und Besucher merken nichts. Abgewiesene Einsendungen werden je Tag und Grund gezählt (ohne Inhalte, ohne IP-Adressen)."
  KOEDER_LABEL: "Dieses Feld bitte leer lassen"
  FREMDE_FORMULARE_LABEL: "Weitere Formulare schützen"
  FREMDE_FORMULARE_HELP: "Formulare, die nicht vom form-Plugin stammen: genau die Adresse aus dem action-Attribut eintragen, z. B. /newsletter/subscribe. Verglichen wird das Ende der Adresse, darum muss der Eintrag mit einem Schrägstrich beginnen — «subscribe» allein träfe sonst auch «/unsubscribe». Fehlt der Strich, wird er ergänzt. Leer heisst: keines."

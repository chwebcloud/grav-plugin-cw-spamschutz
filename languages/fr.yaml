PLUGIN_CW_SPAMSCHUTZ:
  ABGEWIESEN: "Votre message n'a malheureusement pas pu être envoyé. Veuillez réessayer dans quelques minutes ou nous écrire directement par e-mail."
  SEITE_NEU_LADEN: "Le formulaire est resté ouvert trop longtemps. Veuillez recharger la page et l'envoyer à nouveau."
  ENABLED_LABEL: "Extension activée"
  KOEDERFELD_LABEL: "Champ-piège"
  KOEDERFELD_HELP: "Un champ invisible que seuls les robots remplissent. S'il est rempli, l'envoi est refusé."
  MINDESTZEIT_SECTION_TITLE: "Temps minimum"
  MINDESTZEIT_AKTIV_LABEL: "Vérifier le temps de saisie"
  MINDESTZEIT_AKTIV_HELP: "Une personne met quelques secondes à remplir un formulaire; les robots envoient aussitôt. Un envoi pour un formulaire jamais chargé est également refusé."
  MINDESTZEIT_SEKUNDEN_LABEL: "Au moins (secondes)"
  MINDESTZEIT_MAX_STUNDEN_LABEL: "Au plus (heures)"
  MINDESTZEIT_MAX_STUNDEN_HELP: "Un formulaire resté ouvert plus longtemps doit être rechargé."
  INHALT_SECTION_TITLE: "Règles de contenu"
  INHALT_AKTIV_LABEL: "Vérifier le contenu"
  INHALT_MAX_LINKS_LABEL: "Liens autorisés par envoi"
  INHALT_FREMDE_SCHRIFT_LABEL: "Refuser les messages en écriture étrangère"
  INHALT_FREMDE_SCHRIFT_HELP: "Cyrillique, chinois, japonais, coréen, arabe, thaï: les messages écrits majoritairement dans ces écritures, ou quelques caractères accompagnés d'un lien. Un simple nom en écriture étrangère reste autorisé."
  INHALT_SPERRWOERTER_LABEL: "Mots bloqués"
  INHALT_SPERRWOERTER_HELP: "Si l'un de ces mots apparaît quelque part dans l'envoi, celui-ci est refusé. La casse n'a pas d'importance."
  INHALT_SPAM_ENDUNGEN_LABEL: "Extensions de domaine à spam"
  INHALT_SPAM_ENDUNGEN_HELP: "Les liens vers des domaines portant ces extensions ne mènent presque qu'à du spam (par exemple top, xyz). Un envoi contenant un tel lien est refusé."
  BEGRENZUNG_SECTION_TITLE: "Limite par expéditeur"
  BEGRENZUNG_AKTIV_LABEL: "Appliquer une limite"
  BEGRENZUNG_ANZAHL_LABEL: "Envois autorisés"
  BEGRENZUNG_MINUTEN_LABEL: "… en l'espace de (minutes)"
  MELDUNG_SECTION_TITLE: "Message"
  MELDUNG_LABEL: "Message affiché en cas de refus"
  MELDUNG_HELP: "Laissez vide pour le texte par défaut («Votre message n'a pas pu être envoyé …»). Indiquez toujours une porte de sortie aux vraies personnes, par exemple une adresse e-mail."
